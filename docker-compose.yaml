services:
  # 백엔드 서비스 설정
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/alembic
    environment:
      - ENV_FILE=.env
      - PYTHONPATH=.:apps
    env_file:
      - ./backend/.env

  # 프론트엔드 서비스 설정
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000
    depends_on:
      - backend
