services:
  # 로컬 Docker 개발용 PostgreSQL (Neon .env 비밀번호 오류 시에도 백엔드 기동)
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ragwatson
      POSTGRES_PASSWORD: ragwatson
      POSTGRES_DB: ragwatson
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragwatson -d ragwatson"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 백엔드 서비스 설정
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/alembic
    environment:
      - ENV_FILE=.env
      - PYTHONPATH=.:apps
      # env_file의 Neon URL보다 우선 — Docker Compose 로컬 DB 사용
      - DATABASE_URL=postgresql://ragwatson:ragwatson@db:5432/ragwatson
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  # 프론트엔드 서비스 설정
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
